kind: pipeline
type: docker
name: default

steps:
  - name: install-deps
    image: oven/bun:1  # 或 oven/bun:1-alpine（更小、更快），推荐用最新 tag 如 oven/bun:1.1 或 oven/bun:latest
    commands:
      - bun install --frozen-lockfile  # --frozen-lockfile 类似 npm ci，强制用 bun.lockb，不更新 lockfile
    volumes:
      - name: bun-cache
        path: /root/.bun/install/cache  # 加速后续构建，可选但强烈推荐

  - name: lint-and-test  # 可选，如果你有 lint/test 脚本
    image: oven/bun:1
    commands:
      - bun run lint    # 或 bun run test
      - bun run test
    volumes:
      - name: bun-cache
        path: /root/.bun/install/cache

  - name: deploy-to-cloudflare
    image: node:20-alpine  # 切换到 Node.js 镜像（Wrangler 官方支持）
    commands:
      - corepack enable   # 启用 corepack（Node 自带工具），激活 npm/pnpm/yarn
      - corepack prepare npm@latest --activate   # 可选，确保最新 npm
      # Bun 自带 wrangler 支持？目前 wrangler 还是 Node 包，但 Bun 可以完美兼容运行
      # - bunx wrangler@latest deploy --verbose  # 用 bunx 执行 wrangler（类似 npx），自动下载 wrangler
      # 或者先全局安装（如果项目依赖 wrangler）
      - npm install -g wrangler
      - wrangler deploy 
      - cat /root/.config/.wrangler/logs/*.log
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cf_api_token
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: cf_account_id  # 如果 wrangler.toml 没写 account_id
    when:
      branch: main  # 只在 main 分支自动部署（可选，PR 时只跑前面的步骤）

volumes:
  - name: bun-cache
    temp: {}  # Drone 的临时 volume，构建间共享缓存