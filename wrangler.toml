name = "subscribe-manager"
main = "src/worker.js"
compatibility_date = "2026-02-06"

[[kv_namespaces]]
binding = "SUBS_KV"
id = "a4e10ce96170474fbd2f65b614d13f67"
preview_id = "1fd627033f384c64be957349620e4b98"

[triggers]
crons = ["* * * * *"]

[dev]
port = 8034

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
